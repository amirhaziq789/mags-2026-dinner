<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGS 2026 Registration</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: white; width: 100%; max-width: 500px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        
        .header { background: linear-gradient(135deg, #0d47a1, #1976d2); color: white; padding: 30px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 26px; }
        .header p { margin: 5px 0 0; opacity: 0.9; }

        .content { padding: 25px; }

        /* Tabs for Student vs Alumni */
        .category-selector { display: flex; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .cat-btn { flex: 1; padding: 12px; border: none; background: #f8f9fa; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .cat-btn.active { background: #0d47a1; color: white; }

        .price-box { background: #e3f2fd; border: 2px dashed #1976d2; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .price-tag { font-size: 28px; font-weight: 800; color: #0d47a1; }
        .old-price { text-decoration: line-through; color: #777; margin-right: 8px; }
        .badge { background: #d32f2f; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; vertical-align: middle; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        .static-field { padding: 12px; background: #f9f9f9; border: 1px solid #eee; border-radius: 6px; color: #555; }

        .btn-submit { width: 100%; padding: 14px; background: #1976d2; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #1565c0; }

        #successMessage { display: none; text-align: center; }
        .action-btn { display: block; width: 100%; padding: 12px; margin-top: 10px; text-align: center; text-decoration: none; border-radius: 6px; font-weight: bold; box-sizing: border-box; }
        .pay-btn { background: #ff9800; color: white; }
        .wa-btn { background: #25D366; color: white; }
        
        #loading { display: none; text-align: center; color: #666; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MAGS 2026</h1>
        <p>Vivatel Hotel KL | 5 June 2026</p>
    </div>

    <div class="content">
        <div class="category-selector">
            <button type="button" class="cat-btn active" onclick="setCategory('Student')" id="btnStudent">Student</button>
            <button type="button" class="cat-btn" onclick="setCategory('Alumni')" id="btnAlumni">Alumni</button>
        </div>

        <div class="price-box" id="priceDisplay">Loading...</div>

        <form id="regForm" name="submit-to-google-sheet">
            <input type="hidden" name="category" id="categoryInput" value="Student">
            <input type="hidden" name="total_price" id="totalPriceInput">
            
            <input type="hidden" name="pax" value="1">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" required placeholder="012-3456789">
            </div>

            <div class="form-group" id="matrixGroup">
                <label>Matrix Number</label>
                <input type="text" name="matrix_no" id="matrixInput" required placeholder="e.g. S2180000 / 23002000">
            </div>

            <div class="form-group">
                <label>Registration Type</label>
                <div class="static-field">
                    👤 Individual (1 Pax)
                </div>
                <p style="font-size:12px; color:#888; margin-top:4px;">*To register for a friend, please submit a separate form.</p>
            </div>

            <button type="submit" class="btn-submit">Register Now</button>
        </form>

        <div id="loading">Saving data...</div>

        <div id="successMessage">
            <h2 style="color:green">Registration Success!</h2>
            <p>Please complete your payment below.</p>
            <a id="payLink" href="#" target="_blank" class="action-btn pay-btn">Pay Now</a>
            
            <a id="waLink" href="#" target="_blank" class="action-btn wa-btn">Join WhatsApp Group</a>
        </div>
    </div>
</div>

<script>
    // ===============================================
    // 1. PASTE YOUR LINKS HERE
    // ===============================================
    
    // Google Sheet Script URL
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbygw3YSuC_CWSwaaDPCGb9I_eq86wBpzIiEoQqAPNsLVYrEd0OrvBVf85XJcpbB5gj3Tg/exec';
    
    // WhatsApp Group Links (NEW: TWO LINKS)
    const WA_GROUP_STUDENT = 'https://chat.whatsapp.com/PASTE_STUDENT_LINK_HERE';
    const WA_GROUP_ALUMNI  = 'https://chat.whatsapp.com/PASTE_ALUMNI_LINK_HERE';
    
    // ToyyibPay Bill Links
    const LINK_STUDENT_EARLY = 'https://toyyibpay.com/Student-Early-Bird';
    const LINK_STUDENT_NORMAL = 'https://toyyibpay.com/Student-Standard';
    const LINK_ALUMNI = 'https://toyyibpay.com/Alumni-Registration';

    // Promo Date
    const EARLY_BIRD_END_DATE = new Date(2026, 4, 30); // May 30, 2026
    // ===============================================

    let currentCategory = 'Student';
    let unitPrice = 100;
    let finalPayLink = '';
    let finalWaLink = '';

    function setCategory(cat) {
        currentCategory = cat;
        document.getElementById('categoryInput').value = cat;
        
        // Toggle UI Buttons
        document.getElementById('btnStudent').className = cat === 'Student' ? 'cat-btn active' : 'cat-btn';
        document.getElementById('btnAlumni').className = cat === 'Alumni' ? 'cat-btn active' : 'cat-btn';

        // Show/Hide Matrix Input
        const matrixInput = document.getElementById('matrixInput');
        const matrixGroup = document.getElementById('matrixGroup');
        if (cat === 'Alumni') {
            matrixGroup.style.display = 'none';
            matrixInput.removeAttribute('required'); // Alumni don't need matrix
        } else {
            matrixGroup.style.display = 'block';
            matrixInput.setAttribute('required', 'true'); // Students need matrix
        }
        updatePrice();
    }

    function updatePrice() {
        const today = new Date();
        const display = document.getElementById('priceDisplay');

        if (currentCategory === 'Student') {
            // Student Logic
            finalWaLink = WA_GROUP_STUDENT; // Set Student WA Link

            if (today <= EARLY_BIRD_END_DATE) {
                unitPrice = 90;
                finalPayLink = LINK_STUDENT_EARLY;
                display.innerHTML = `
                    <span class="old-price">RM100</span>
                    <span class="price-tag">RM90</span>
                    <span class="badge">EARLY BIRD</span>
                    <p style="font-size:12px; margin:5px 0 0;">Valid until 30 May 2026</p>`;
            } else {
                unitPrice = 100;
                finalPayLink = LINK_STUDENT_NORMAL;
                display.innerHTML = `<span class="price-tag">RM100</span><p style="font-size:12px; margin:5px 0 0;">Standard Student Rate</p>`;
            }
        } else {
            // Alumni Logic
            unitPrice = 150;
            finalPayLink = LINK_ALUMNI;
            finalWaLink = WA_GROUP_ALUMNI; // Set Alumni WA Link

            display.innerHTML = `<span class="price-tag">RM150</span><p style="font-size:12px; margin:5px 0 0;">Alumni / VIP Rate</p>`;
        }

        // Calculate Total
        document.getElementById('totalPriceInput').value = unitPrice;
        
        // Update Buttons
        document.getElementById('payLink').href = finalPayLink;
        document.getElementById('waLink').href = finalWaLink;
    }

    // Initialize
    updatePrice();

    // Submission Logic
    const form = document.forms['submit-to-google-sheet'];
    const loading = document.getElementById('loading');
    const successMsg = document.getElementById('successMessage');

    form.addEventListener('submit', e => {
        e.preventDefault();
        loading.style.display = 'block';
        form.style.display = 'none';
        
        fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                loading.style.display = 'none';
                successMsg.style.display = 'block';
            })
            .catch(error => {
                alert("Error saving data!");
                loading.style.display = 'none';
                form.style.display = 'block';
            });
    });
</script>

</body>

</html>
