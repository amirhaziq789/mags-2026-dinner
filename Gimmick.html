<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAGS 2026 Gimmick</title>
    <link rel="icon" type="image/x-icon" href="https://i.postimg.cc/QdfjV8KC/Full-White-(1).png">
    <style>
        /* --- THEME & STYLING --- */
        body {
            background-color: #05010a;
            color: #00e5ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 229, 255, 0.1) 0%, transparent 50%);
        }

        h1 {
            text-shadow: 0 0 15px #00e5ff;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-align: center;
            z-index: 10;
        }

        p.instructions {
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            margin-bottom: 30px;
            font-size: 1.2rem;
            z-index: 10;
        }

        /* --- PUZZLE BOARD --- */
        #board-container {
            width: min(80vw, 600px);
            height: min(80vw, 600px);
            background-color: #1a0b2e;
            padding: 5px;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.5);
            border-radius: 10px;
            transition: all 1.5s ease-in-out;
            z-index: 10;
        }

        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            width: 100%;
            height: 100%;
        }

        .piece {
            background-size: 300% 300%;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
            border-radius: 5px;
            /* Added background-color in case image is transparent */
            background-color: #000; 
        }

        .piece:active {
            transform: scale(0.95);
        }

        .piece.selected {
            transform: scale(0.90);
            box-shadow: 0 0 20px #ff00ff;
            border: 3px solid #ff00ff;
            z-index: 20;
        }

        /* --- GIMMICK EXECUTION ANIMATIONS --- */
        #success-message {
            display: none;
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0.5px 0 0 #ff00ff, -0.5px 0 0 #00e5ff; /* Start with chromatic effect */
            margin-top: 30px;
            letter-spacing: 3px;
            z-index: 10;
        }

        /* Applied upon completion */
        body.time-warp #board-container {
            border-radius: 30px; /* Rounded edges for final logo */
            overflow: hidden;
            border: none;
            padding: 0;
            /* Combine a quick intense glitch phase with the stabilized glow and pop */
            animation: interface-glitch 0.4s 2 ease-in-out, pop-glow 5s forwards;
            box-shadow: 0 0 100px #ff00ff, 0 0 200px #00e5ff;
        }

        body.time-warp #puzzle-board {
            gap: 0;
        }

        body.time-warp .piece {
            border-radius: 0;
        }

        /* Continuous glitch effect for success message */
        body.time-warp #success-message {
            display: block;
            animation: glitch-text 5s infinite alternate ease-in-out; 
        }

        /* === NEW GLITCH ANIMATIONS === */

        /* Intense chromatic distortion for text */
        @keyframes glitch-text {
            0% { text-shadow: 0.5px 0 0 #ff00ff, -0.5px 0 0 #00e5ff; transform: translate(0); }
            4% { text-shadow: 2px 0 0 #ff00ff, -2px 0 0 #00e5ff; transform: translate(-2px, 1px); }
            8% { text-shadow: -2px 0 0 #ff00ff, 2px 0 0 #00e5ff; transform: translate(2px, -1px); }
            12% { text-shadow: 0.5px 0 0 #ff00ff, -0.5px 0 0 #00e5ff; transform: translate(0); }
            100% { text-shadow: 0.5px 0 0 #ff00ff, -0.5px 0 0 #00e5ff; transform: translate(0); }
        }

        /* Distortion and filtering for containers */
        @keyframes interface-glitch {
            0% { transform: skew(0deg) scale(1); filter: hue-rotate(0deg); opacity: 1; }
            5% { transform: skew(3deg) scale(1.03); filter: hue-rotate(90deg); opacity: 0.8; }
            10% { transform: skew(-3deg) scale(1); filter: hue-rotate(0deg); opacity: 1; }
            15% { transform: skew(1.5deg) scale(1.05); filter: hue-rotate(-90deg); opacity: 0.9; }
            20% { transform: skew(0deg) scale(1); filter: hue-rotate(0deg); opacity: 1; }
            100% { transform: skew(0deg) scale(1); filter: hue-rotate(0deg); opacity: 1; }
        }

        /* Established pop animation */
        @keyframes pop-glow {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- FIREWORKS CANVAS --- */
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Lets you tap through the fireworks */
            z-index: 1; /* Behind the puzzle, or change to 999 to put in front */
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>

    <h1>TEMPORAL LOCK</h1>
    <p class="instructions" id="instruction-text">Tap two pieces to swap them and realign the timeline.</p>

    <div id="board-container">
        <div id="puzzle-board"></div>
    </div>

    <div id="success-message">TIMELINE RESTORED</div>

    <script>
        // ==========================================
        // 1. SETUP: DIRECT LOGO LINK UPDATED
        // ==========================================
        const LOGO_URL = 'https://i.postimg.cc/W4349573/Gold-(-Black-).png'; 
        
        const GRID_SIZE = 3; 
        const TOTAL_PIECES = GRID_SIZE * GRID_SIZE;
        const board = document.getElementById('puzzle-board');
        
        let pieces = [];
        let selectedPiece = null;
        let isLocked = false;

        // ==========================================
        // 2. INITIALIZE THE PUZZLE
        // ==========================================
        function initPuzzle() {
            let correctOrder = Array.from({length: TOTAL_PIECES}, (_, i) => i);
            let shuffledOrder = [...correctOrder].sort(() => Math.random() - 0.5);

            shuffledOrder.forEach((originalIndex, currentIndex) => {
                const piece = document.createElement('div');
                piece.classList.add('piece');
                piece.style.backgroundImage = `url('${LOGO_URL}')`;
                
                const row = Math.floor(originalIndex / GRID_SIZE);
                const col = originalIndex % GRID_SIZE;
                
                const bgPosX = (col / (GRID_SIZE - 1)) * 100;
                const bgPosY = (row / (GRID_SIZE - 1)) * 100;
                
                piece.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;
                piece.dataset.originalIndex = originalIndex;
                piece.dataset.currentIndex = currentIndex;
                
                piece.addEventListener('click', () => handlePieceTap(piece));
                
                board.appendChild(piece);
                pieces.push(piece);
            });
        }

        // ==========================================
        // 3. INTERACTIVITY: TAP TO SWAP
        // ==========================================
        function handlePieceTap(piece) {
            if (isLocked) return;

            if (!selectedPiece) {
                selectedPiece = piece;
                piece.classList.add('selected');
            } else {
                if (selectedPiece !== piece) {
                    swapPieces(selectedPiece, piece);
                }
                selectedPiece.classList.remove('selected');
                selectedPiece = null;
            }
        }

        function swapPieces(piece1, piece2) {
            const tempNode = document.createElement('div');
            board.insertBefore(tempNode, piece1);
            board.insertBefore(piece1, piece2);
            board.insertBefore(piece2, tempNode);
            board.removeChild(tempNode);

            const tempIndex = piece1.dataset.currentIndex;
            piece1.dataset.currentIndex = piece2.dataset.currentIndex;
            piece2.dataset.currentIndex = tempIndex;

            checkWinCondition();
        }

        // ==========================================
        // 4. THE GIMMICK (WIN CONDITION)
        // ==========================================
        function checkWinCondition() {
            const currentDOMPieces = Array.from(board.children);
            const isSolved = currentDOMPieces.every((piece, index) => {
                return parseInt(piece.dataset.originalIndex) === index;
            });

            if (isSolved) {
                executeGimmick();
            }
        }

        function executeGimmick() {
            isLocked = true; 
            
            // Trigger CSS animations (now including immediate intense glitch)
            document.body.classList.add('time-warp');
            
            // Update UI
            document.getElementById('instruction-text').style.display = 'none';
            // Start the infinite glitch text animation (applied via CSS class above)

            // Start Fireworks!
            startFireworks();
        }

        // ==========================================
        // 5. FIREWORKS SYSTEM (UPGRADED)
        // ==========================================
        const fwCanvas = document.getElementById('fireworks-canvas');
        const ctx = fwCanvas.getContext('2d');
        let fwParticles = [];

        function resizeCanvas() {
            fwCanvas.width = window.innerWidth;
            fwCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                // Increased speed for faster bursts
                const speed = Math.random() * 15 + 5; 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                // Adjusted decay so they travel further before fading
                this.decay = Math.random() * 0.03 + 0.01; 
                this.gravity = 0.1; 
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.alpha -= this.decay;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y) {
            const themeColors = ['#FF0000', '#FFD700', '#C0C0C0', '#0000FF', '#00e5ff', '#ff00ff'];
            // Increased particle count from 60 to 150 per explosion
            for (let i = 0; i < 150; i++) {
                const randomColor = themeColors[Math.floor(Math.random() * themeColors.length)];
                fwParticles.push(new FireworkParticle(x, y, randomColor));
            }
        }

        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            ctx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            
            // Increased spawn rate from 5% to 20% per frame
            if (Math.random() < 0.20) {
                const randomX = Math.random() * fwCanvas.width;
                const randomY = Math.random() * (fwCanvas.height * 0.8);
                createExplosion(randomX, randomY);
            }

            fwParticles = fwParticles.filter(p => p.alpha > 0);
            fwParticles.forEach(p => {
                p.update();
                p.draw(ctx);
            });
        }

        function startFireworks() {
            fwCanvas.style.display = 'block';
            // Large initial center blast
            createExplosion(fwCanvas.width / 2, fwCanvas.height / 2);
            createExplosion(fwCanvas.width / 2 + 50, fwCanvas.height / 2);
            createExplosion(fwCanvas.width / 2 - 50, fwCanvas.height / 2);
            animateFireworks();
        }

        // Start the engine
        window.onload = initPuzzle;
    </script>
</body>
</html>
