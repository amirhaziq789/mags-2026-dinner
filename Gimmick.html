<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAGS 2026 Gimmick</title>
    <link rel="icon" type="image/x-icon" href="https://i.postimg.cc/QdfjV8KC/Full-White-(1).png">
    <style>
        /* --- THEME & STYLING --- */
        body {
            background-color: #05010a;
            color: #00e5ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 229, 255, 0.1) 0%, transparent 50%);
            touch-action: none; 
        }

        /* Scanline Overlay (Only visible during time warp) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.2),
                rgba(0, 0, 0, 0.2) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 999;
            opacity: 0;
        }

        body.time-warp::before {
            animation: static-flash 4s forwards;
        }

        h1 {
            text-shadow: 0 0 15px #00e5ff;
            letter-spacing: 5px;
            margin-bottom: 5px;
            text-align: center;
            z-index: 10;
        }

        p.instructions {
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            margin-bottom: 20px;
            font-size: 1.2rem;
            text-align: center;
            z-index: 10;
        }

        /* --- DRAG AND DROP ZONES LAYOUT --- */
        #game-area {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 3vw;
            width: 100vw;
            max-width: 1200px;
            z-index: 10;
        }

        :root {
            /* Board size responsive to viewport */
            --board-size: min(45vw, 450px);
        }

        .scatter-zone {
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 12px;
            width: 25vw;
            min-height: var(--board-size);
            padding: 10px;
            border: 1px dashed rgba(255, 0, 255, 0.1);
            border-radius: 10px;
            background-color: rgba(26, 11, 46, 0.2);
        }

        /* --- PUZZLE BOARD --- */
        #board-container {
            width: var(--board-size);
            height: var(--board-size);
            background-color: #1a0b2e;
            padding: 5px;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.5);
            border-radius: 10px;
            transition: all 0.2s ease-in-out;
            position: relative;
        }

        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            width: 100%;
            height: 100%;
        }

        .drop-slot {
            width: 100%;
            height: 100%;
            background-color: rgba(0, 229, 255, 0.05);
            border: 1px dashed rgba(0, 229, 255, 0.25);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* --- FIXED FIXED PIECE SIZING --- */
        .piece {
            /* Width and height are exactly locked to 1/3 of the board container */
            width: calc(var(--board-size) / 3 - 6px);
            height: calc(var(--board-size) / 3 - 6px);
            background-size: var(--board-size) var(--board-size);
            cursor: grab;
            border-radius: 5px;
            background-color: #000; 
            touch-action: none;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
            transition: box-shadow 0.2s;
            box-sizing: border-box;
        }

        .piece:active {
            cursor: grabbing;
        }

        /* Ensure piece scales nicely inside the slot grid */
        .drop-slot .piece {
            width: 100%;
            height: 100%;
            box-shadow: none;
        }

        /* --- GIMMICK EXECUTION ANIMATIONS --- */
        #success-message {
            display: none;
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 0 0 #ff00ff, -2px 0 0 #00e5ff;
            margin-top: 30px;
            letter-spacing: 3px;
            z-index: 10;
        }

        body.time-warp .drop-slot {
            border: none;
            background: transparent;
        }

        body.time-warp .scatter-zone {
            opacity: 0;
            transition: opacity 0.5s;
            border-color: transparent;
            background: transparent;
        }

        body.time-warp #board-container {
            border-radius: 30px;
            overflow: hidden;
            border: none;
            padding: 0;
            animation: intense-glitch 4s steps(2, end) forwards, pop-glow 5s 4s forwards;
            box-shadow: 0 0 100px #ff00ff, 0 0 200px #00e5ff;
        }

        body.time-warp #puzzle-board {
            gap: 0;
        }

        body.time-warp .piece {
            border-radius: 0;
            width: 100%;
            height: 100%;
        }

        body.time-warp #success-message {
            display: block;
            animation: glitch-text-violent 4s linear forwards, smooth-glitch-text 2s 4s infinite alternate ease-in-out; 
        }

        /* === AGGRESSIVE GLITCH KEYFRAMES === */
        @keyframes intense-glitch {
            0%   { transform: translate(0) skew(0deg) scale(1); filter: hue-rotate(0deg); }
            5%   { transform: translate(-30px, 15px) skew(15deg) scale(1.05); filter: invert(100%) hue-rotate(90deg); box-shadow: -20px 0 0 #ff00ff, 20px 0 0 #00e5ff; }
            10%  { transform: translate(20px, -20px) skew(-20deg) scale(0.9); filter: invert(0%) hue-rotate(180deg); }
            15%  { transform: translate(-10px, 20px) skew(5deg) scale(1.2); filter: drop-shadow(15px 0 red); }
            20%  { transform: translate(40px, -5px) skew(-25deg); filter: invert(100%); }
            25%  { transform: translate(-25px, -25px) skew(30deg) scale(0.8); filter: hue-rotate(270deg); }
            30%  { transform: translate(15px, 15px) skew(-5deg) scale(1.1); filter: invert(0%) drop-shadow(-20px 0 magenta); }
            40%  { transform: translate(-40px, 10px) skew(20deg); filter: hue-rotate(45deg); opacity: 0.5; }
            45%  { transform: translate(20px, -15px) skew(-10deg) scale(1.3); filter: invert(100%); opacity: 1; }
            50%  { transform: translate(-5px, 25px) skew(10deg); filter: drop-shadow(15px 15px yellow); }
            55%  { transform: translate(35px, 0px) skew(-35deg) scale(0.9); filter: invert(100%) hue-rotate(120deg); }
            65%  { transform: translate(-15px, -30px) skew(15deg) scale(1); filter: hue-rotate(300deg); box-shadow: 40px 0 0 #ff00ff, -40px 0 0 #00e5ff; }
            75%  { transform: translate(25px, 20px) skew(-15deg) scale(1.15); filter: invert(0%); }
            85%  { transform: translate(-10px, -10px) skew(5deg); filter: invert(100%) hue-rotate(200deg); }
            95%  { transform: translate(10px, 5px) skew(-5deg) scale(1.05); filter: drop-shadow(0 0 50px cyan); }
            100% { transform: translate(0) skew(0deg) scale(1); filter: hue-rotate(0deg); box-shadow: 0 0 100px #ff00ff, 0 0 200px #00e5ff; }
        }

        @keyframes glitch-text-violent {
            0%   { text-shadow: 5px 0 0 #ff00ff, -5px 0 0 #00e5ff; transform: translate(0) scale(1); color: #fff;}
            10%  { text-shadow: 20px 0 0 #ff00ff, -20px 0 0 #00e5ff; transform: translate(-10px, 5px) scale(1.1); color: yellow; }
            20%  { text-shadow: -25px 0 0 #ff00ff, 25px 0 0 #00e5ff; transform: translate(10px, -5px) skew(20deg); color: cyan; }
            30%  { text-shadow: 15px 15px 0 #ff00ff, -15px -15px 0 #00e5ff; transform: translate(-15px, 10px) scale(0.9); color: magenta; }
            40%  { text-shadow: -30px 0 0 #ff00ff, 30px 0 0 #00e5ff; transform: translate(15px, -10px) skew(-30deg); color: #fff; }
            50%  { text-shadow: 10px -10px 0 red, -10px 10px 0 blue; transform: translate(-5px, 15px) scale(1.2); }
            60%  { text-shadow: -20px 0 0 #ff00ff, 20px 0 0 #00e5ff; transform: translate(10px, 5px) skew(15deg); color: yellow; }
            70%  { text-shadow: 35px 0 0 #ff00ff, -35px 0 0 #00e5ff; transform: translate(-20px, -5px) scale(0.8); }
            80%  { text-shadow: -15px 0 0 #ff00ff, 15px 0 0 #00e5ff; transform: translate(15px, 10px) skew(-25deg); color: cyan; }
            90%  { text-shadow: 10px 0 0 #ff00ff, -10px 0 0 #00e5ff; transform: translate(-10px, -15px) scale(1.1); }
            100% { text-shadow: 2px 0 0 #ff00ff, -2px 0 0 #00e5ff; transform: translate(0) skew(0) scale(1); color: #fff; }
        }

        @keyframes smooth-glitch-text {
            0% { text-shadow: 1px 0 0 #ff00ff, -1px 0 0 #00e5ff; transform: translate(0); }
            33% { text-shadow: -2px 0 0 #ff00ff, 2px 0 0 #00e5ff; transform: translate(1px, -1px); }
            66% { text-shadow: 2px 0 0 #ff00ff, -2px 0 0 #00e5ff; transform: translate(-1px, 1px); }
            100% { text-shadow: 1px 0 0 #ff00ff, -1px 0 0 #00e5ff; transform: translate(0); }
        }

        @keyframes static-flash {
            0%   { opacity: 0; }
            10%  { opacity: 0.8; }
            15%  { opacity: 0; }
            25%  { opacity: 0.5; }
            35%  { opacity: 0; }
            45%  { opacity: 0.9; }
            50%  { opacity: 0.2; }
            60%  { opacity: 0.7; }
            75%  { opacity: 0; }
            85%  { opacity: 0.6; }
            95%  { opacity: 0.1; }
            100% { opacity: 0; }
        }

        @keyframes pop-glow {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- FIREWORKS CANVAS --- */
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1; 
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>

    <h1>TEMPORAL LOCK</h1>
    <p class="instructions" id="instruction-text">Drag and drop the temporal fragments to restore the timeline.</p>

    <div id="game-area">
        <div id="left-scatter" class="scatter-zone"></div>
        
        <div id="board-container">
            <div id="puzzle-board"></div>
        </div>

        <div id="right-scatter" class="scatter-zone"></div>
    </div>

    <div id="success-message">TIMELINE RESTORED</div>

    <script>
        // ==========================================
        // 1. SETUP & VARIABLES
        // ==========================================
        const LOGO_URL = 'https://i.postimg.cc/W4349573/Gold-(-Black-).png'; 
        const GRID_SIZE = 3; 
        const TOTAL_PIECES = GRID_SIZE * GRID_SIZE;
        
        const board = document.getElementById('puzzle-board');
        const leftScatter = document.getElementById('left-scatter');
        const rightScatter = document.getElementById('right-scatter');
        
        let isLocked = false;
        
        // Dragging State Engine
        let activePiece = null;
        let offsetX = 0;
        let offsetY = 0;
        let originalParent = null;

        // ==========================================
        // 2. INITIALIZE THE PUZZLE
        // ==========================================
        function initPuzzle() {
            // Generate empty structural slots
            for (let i = 0; i < TOTAL_PIECES; i++) {
                const slot = document.createElement('div');
                slot.classList.add('drop-slot');
                slot.dataset.slotIndex = i;
                board.appendChild(slot);
            }

            // Slice & Shuffling Array Logic
            let correctOrder = Array.from({length: TOTAL_PIECES}, (_, i) => i);
            let shuffledOrder = [...correctOrder].sort(() => Math.random() - 0.5);

            shuffledOrder.forEach((originalIndex, i) => {
                const piece = document.createElement('div');
                piece.classList.add('piece');
                piece.style.backgroundImage = `url('${LOGO_URL}')`;
                
                const row = Math.floor(originalIndex / GRID_SIZE);
                const col = originalIndex % GRID_SIZE;
                
                const bgPosX = (col / (GRID_SIZE - 1)) * 100;
                const bgPosY = (row / (GRID_SIZE - 1)) * 100;
                
                piece.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;
                piece.dataset.originalIndex = originalIndex;
                
                // Active Universal Pointer Handlers
                piece.addEventListener('pointerdown', handlePointerDown);
                
                // Distribute cleaner across zones
                if (i % 2 === 0) {
                    leftScatter.appendChild(piece);
                } else {
                    rightScatter.appendChild(piece);
                }
            });

            document.addEventListener('pointermove', handlePointerMove);
            document.addEventListener('pointerup', handlePointerUp);
        }

        // ==========================================
        // 3. SECURE DRAG & DROP HANDLING
        // ==========================================
        function handlePointerDown(e) {
            if (isLocked) return;
            e.preventDefault(); 

            activePiece = e.target;
            originalParent = activePiece.parentElement;

            const rect = activePiece.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            // Fluid ghost drifting styles overlay
            activePiece.style.width = rect.width + 'px';
            activePiece.style.height = rect.height + 'px';
            activePiece.style.position = 'fixed';
            activePiece.style.zIndex = '1000';
            activePiece.style.boxShadow = '0 0 30px #ff00ff';
            
            document.body.appendChild(activePiece);
            movePiece(e.clientX, e.clientY);
        }

        function handlePointerMove(e) {
            if (!activePiece || isLocked) return;
            e.preventDefault();
            movePiece(e.clientX, e.clientY);
        }

        function movePiece(x, y) {
            activePiece.style.left = (x - offsetX) + 'px';
            activePiece.style.top = (y - offsetY) + 'px';
        }

        function handlePointerUp(e) {
            if (!activePiece || isLocked) return;

            activePiece.style.display = 'none';
            let elemBelow = document.elementFromPoint(e.clientX, e.clientY);
            activePiece.style.display = 'block';

            let targetSlot = elemBelow ? elemBelow.closest('.drop-slot') : null;
            let targetScatter = elemBelow ? elemBelow.closest('.scatter-zone') : null;

            // Purge float drag state configurations cleanly
            activePiece.style.position = '';
            activePiece.style.left = '';
            activePiece.style.top = '';
            activePiece.style.width = '';
            activePiece.style.height = '';
            activePiece.style.zIndex = '10';
            activePiece.style.boxShadow = '';

            if (targetSlot) {
                // Swap pieces seamlessly if slot contains an entity
                if (targetSlot.children.length > 0) {
                    const existingPiece = targetSlot.children[0];
                    originalParent.appendChild(existingPiece);
                }
                targetSlot.appendChild(activePiece);
            } else if (targetScatter) {
                targetScatter.appendChild(activePiece);
            } else {
                originalParent.appendChild(activePiece);
            }

            activePiece = null;
            checkWinCondition();
        }

        // ==========================================
        // 4. WIN DETECTION SYSTEM
        // ==========================================
        function checkWinCondition() {
            const slots = Array.from(document.querySelectorAll('.drop-slot'));
            
            const isSolved = slots.every((slot, index) => {
                if (slot.children.length === 0) return false;
                const piece = slot.children[0];
                return parseInt(piece.dataset.originalIndex) === index;
            });

            if (isSolved) {
                executeGimmick();
            }
        }

        function executeGimmick() {
            isLocked = true; 
            document.body.classList.add('time-warp');
            document.getElementById('instruction-text').style.display = 'none';
            startFireworks();
        }

        // ==========================================
        // 5. INTENSE SYSTEM ENGINE FIREWORKS
        // ==========================================
        const fwCanvas = document.getElementById('fireworks-canvas');
        const ctx = fwCanvas.getContext('2d');
        let fwParticles = [];

        function resizeCanvas() {
            fwCanvas.width = window.innerWidth;
            fwCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 15 + 5; 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.01; 
                this.gravity = 0.1; 
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.alpha -= this.decay;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y) {
            const themeColors = ['#FF0000', '#FFD700', '#C0C0C0', '#0000FF', '#00e5ff', '#ff00ff'];
            for (let i = 0; i < 150; i++) {
                const randomColor = themeColors[Math.floor(Math.random() * themeColors.length)];
                fwParticles.push(new FireworkParticle(x, y, randomColor));
            }
        }

        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            ctx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            
            if (Math.random() < 0.20) {
                const randomX = Math.random() * fwCanvas.width;
                const randomY = Math.random() * (fwCanvas.height * 0.8);
                createExplosion(randomX, randomY);
            }

            fwParticles = fwParticles.filter(p => p.alpha > 0);
            fwParticles.forEach(p => {
                p.update();
                p.draw(ctx);
            });
        }

        function startFireworks() {
            fwCanvas.style.display = 'block';
            createExplosion(fwCanvas.width / 2, fwCanvas.height / 2);
            createExplosion(fwCanvas.width / 2 + 50, fwCanvas.height / 2);
            createExplosion(fwCanvas.width / 2 - 50, fwCanvas.height / 2);
            animateFireworks();
        }

        window.onload = initPuzzle;
    </script>
</body>
</html>
