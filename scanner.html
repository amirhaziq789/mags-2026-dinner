<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGS 2026 Scanner</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background: #1a1a1a; 
            color: #fff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        #reader { width: 100%; flex: 1; background: #000; position: relative;}
        
        /* RESULT BOX STYLES */
        #result { 
            padding: 20px; 
            min-height: 220px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            border-top: 3px solid #444;
            background: #222;
        }
        
        .success { background-color: #2ed573 !important; color: white; }
        .error { background-color: #ff4757 !important; color: white; }
        .warning { background-color: #ffa502 !important; color: white; }
        
        /* TABLE NUMBER STYLE */
        .table-display {
            font-size: 45px;
            font-weight: 900;
            margin: 15px 0;
            background: rgba(0,0,0,0.25);
            padding: 5px 30px;
            border-radius: 12px;
            border: 3px solid rgba(255,255,255,0.6);
            letter-spacing: 2px;
        }

        /* START BUTTON OVERLAY (Required for Audio) */
        #start-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 10;
        }
        button {
            padding: 15px 30px; font-size: 20px; border: none; 
            border-radius: 50px; background: #2ed573; color: white; 
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
        }
    </style>
</head>
<body>

<div id="reader">
    <div id="start-overlay">
        <button onclick="startScanner()">📷 TAP TO START CAMERA</button>
    </div>
</div>

<div id="result">
    <div style="opacity: 0.5;">Waiting for camera...</div>
</div>

<script>
    // ⚠️ PASTE YOUR DEPLOYED SCRIPT URL HERE (Ensure it ends in /exec)
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxEL27oRoDggNCIOF1YP1nwqgoAIP6IRwnTbVKmAjxv242qLRh2eH39tgl9qWjVBCDOBQ/exec';

    const html5QrCode = new Html5Qrcode("reader");
    let isScanning = false;
    
    // Audio Context for Beeps
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function startScanner() {
        // Hide button, start camera
        document.getElementById('start-overlay').style.display = 'none';
        
        // Resume audio context if suspended (common browser requirement)
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }

        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
                // Use the last camera (usually the back camera)
                const cameraId = devices[devices.length - 1].id; 
                html5QrCode.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    onScanSuccess
                );
                document.getElementById('result').innerHTML = "Ready to Scan...";
                isScanning = true;
            }
        }).catch(err => {
            document.getElementById('result').innerText = "Camera Error: " + err;
        });
    }

    // BEEP FUNCTION
    function playBeep(type) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'success') {
            // Happy High Pitch Beep
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'error') {
            // Angry Low Pitch Buzz
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }
    }

    function onScanSuccess(decodedText, decodedResult) {
        if(!isScanning) return;
        
        isScanning = false; 
        const resBox = document.getElementById('result');
        resBox.className = '';
        resBox.style.background = '#333';
        resBox.innerHTML = "<h3>🔍 Checking...</h3>";
        
        html5QrCode.pause();

        const formData = new FormData();
        formData.append('action', 'scan_qr');
        formData.append('qr_data', decodedText);

        fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                playBeep('success');
                resBox.className = 'success';
                resBox.innerHTML = `
                    <div style="font-size: 20px;">✅ WELCOME!</div>
                    <div class="table-display">TABLE ${data.data.table}</div>
                    <div style="font-size: 16px;">${data.data.name}</div>
                `;
            } else if (data.status === 'warning') {
                playBeep('error'); 
                resBox.className = 'warning';
                resBox.innerHTML = `
                    <div style="font-size: 20px;">⚠️ ALREADY CHECKED IN</div>
                    <div class="table-display">TABLE ${data.data.table}</div>
                    <div style="font-size: 16px;">${data.data.name}</div>
                `;
            } else {
                playBeep('error');
                resBox.className = 'error';
                resBox.innerHTML = `
                    <div style="font-size: 24px; margin-bottom:10px;">❌ ${data.message}</div>
                    <div style="font-size: 14px;">${data.data ? data.data.name : 'Unknown User'}</div>
                `;
            }
        })
        .catch(err => {
            resBox.innerHTML = "Connection Error";
        })
        .finally(() => {
            // Wait 3.5 seconds before resetting
            setTimeout(() => {
                resBox.className = '';
                resBox.style.background = '#333';
                resBox.innerHTML = "Ready to Scan...";
                isScanning = true;
                html5QrCode.resume();
            }, 3500);
        });
    }
</script>

</body>
</html>
